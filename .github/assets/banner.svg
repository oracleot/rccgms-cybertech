<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a14"/>
      <stop offset="100%" stop-color="#1a1130"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#dots)"/>

  <!-- ambient glow -->
  <circle cx="1040" cy="60" r="150" fill="#7c3aed" opacity="0.18" filter="url(#soft)"/>
  <circle cx="120" cy="230" r="120" fill="#4338ca" opacity="0.18" filter="url(#soft)"/>

  <!-- monitor icon -->
  <g transform="translate(70,78)">
    <rect x="0" y="0" width="128" height="88" rx="10" fill="#13101f" stroke="url(#brand)" stroke-width="2.5"/>
    <rect x="10" y="10" width="108" height="60" rx="4" fill="url(#screenGlow)"/>
    <rect x="18" y="20" width="46" height="6" rx="3" fill="#c4b5fd"/>
    <rect x="18" y="32" width="70" height="6" rx="3" fill="#a5b4fc" opacity="0.8"/>
    <rect x="18" y="44" width="34" height="6" rx="3" fill="#a5b4fc" opacity="0.6"/>
    <rect x="54" y="88" width="20" height="14" fill="#13101f" stroke="url(#brand)" stroke-width="2.5"/>
    <rect x="34" y="102" width="60" height="8" rx="4" fill="#13101f" stroke="url(#brand)" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="240" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#brand)">Fusion</text>
  <text x="243" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#c7c3d6">Rota · Meetings · Rundowns · Livestreams — the tech-team control room</text>

  <!-- stack chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(243,196)">
      <rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="15" r="5" fill="#ffffff"/>
      <text x="34" y="20" fill="#e5e3f0">Next.js</text>
    </g>
    <g transform="translate(345,196)">
      <rect width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="15" r="5" fill="#3ecf8e"/>
      <text x="32" y="20" fill="#e5e3f0">Supabase</text>
    </g>
    <g transform="translate(455,196)">
      <rect width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="15" r="5" fill="#3178c6"/>
      <text x="32" y="20" fill="#e5e3f0">TypeScript</text>
    </g>
    <g transform="translate(577,196)">
      <rect width="102" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="15" r="5" fill="#06b6d4"/>
      <text x="32" y="20" fill="#e5e3f0">Tailwind</text>
    </g>
  </g>

  <text x="1130" y="256" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7a7690">RCCG Morning Star</text>
</svg>
